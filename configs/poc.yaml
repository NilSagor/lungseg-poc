seed: 42

data:
  root: data/raw/Task06_Lung
  split_file: data/splits/train_val.json
  spacing: [2.0, 2.0, 2.0]
  patch_size: [96, 96, 96]
  num_samples: 2
  pos_neg_ratio: [3, 1]
  hu_window: [-1000, 400]

model:
  channels: [16, 32, 64, 128]
  num_res_units: 1

diffusion:
  timesteps: 10
  beta_start: 0.0001
  beta_end: 0.02
  inference_steps: 10

training:
  batch_size: 1
  num_workers: 2
  baseline_epochs: 20
  diffusion_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.00001
  amp: true
  val_interval: 1
  boundary_weight: 0.1
  diffusion_weight: 1.0

evaluation:
  threshold: 0.5
  sw_batch_size: 2
  overlap: 0.25